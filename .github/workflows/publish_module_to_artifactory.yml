name: Publish datafactory module

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'    # v1.0.0, v1.1.0, etc.

jobs:
  publish:
    uses: CareSourceIT/CPD-Terraform-InfrastructureManagement/.github/workflows/publish_terraform_module_to_artifactory.yml@v1.0.0
    with:
      module_path: '.'         
      module_namespace: container    # Options:  ai, compute, data, database, monitoring, network, security, storage
      module_provider: azurerm
    secrets: inherit
